<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <!-- Importa o CSS personalizado -->
    <link rel="stylesheet" href="style.css">
    <!-- Importa o Tailwind via CDN para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-indigo-600">Tarefas do Dia</h1>

        <!-- Formulário de adição -->
        <form id="todo-form" class="flex gap-2 mb-6">
            <input type="text" id="todo-input" placeholder="O que você precisa fazer?" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Adicionar</button>
        </form>

        <!-- Botões de Filtro -->
        <div class="flex justify-between mb-4 border-b border-gray-200 pb-2">
            <button class="filter-btn active text-indigo-600 font-semibold" data-filter="all">Todas</button>
            <button class="filter-btn text-gray-500 hover:text-indigo-600 transition" data-filter="pending">A Fazer</button>
            <button class="filter-btn text-gray-500 hover:text-indigo-600 transition" data-filter="completed">Concluídas</button>
        </div>

        <!-- Lista onde as tarefas vão aparecer -->
        <ul id="todo-list" class="space-y-3">
            <!-- As tarefas serão injetadas aqui pelo JavaScript -->
        </ul>
    </div>

    <!-- Importa o JavaScript da lógica -->
    <script src="script.js"></script>
</body>
</html>
